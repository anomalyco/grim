[package]
name = "grimoire"
edition.workspace = true
version.workspace = true

[features]
# Grim Beta (src/variant.rs; scripts/bundle.sh --beta): staging, its own name, Keychain service and folders
beta = []

[dependencies]
editor-core = { path = "../editor-core", features = ["decompose"] }
highlight = { path = "../highlight" }
# Rune's `dev` branch (worktree off origin/dev, which has our landed patches: Tx::key_base, Tx::set_title,
# Tx::open_folder, Drag::clicks, Tx::drop_point/El::on_drop_move, App::on_ime/El::ime_cursor); see
# docs/rune-capabilities.md. `native-file-dialog` gives Tx::open_folder its NSOpenPanel.
rune = { path = "../../../worktrees/rune-dev/crates/rune", features = ["native-file-dialog"] }
# Rune decodes images with `image` (png + jpeg); these features unify with its copy so notes' GIF, WebP,
# BMP and TIFF images decode too.
image = { version = "0.25", default-features = false, features = ["gif", "webp", "bmp", "tiff"] }
# Same version and features as Rune, so our layouts match the ones Rune paints.
parley = { version = "0.12", default-features = false, features = ["std"] }
arboard = { version = "3.6", default-features = false }
# Remote workspaces: the room protocol (CollabEditor), JSON, a blocking WebSocket and TLS through the system
# (Security.framework) for https servers.
collab = { path = "../collab" }
serde_json = "1"
native-tls = "0.2"
# The Keychain (app tokens): the app's own generic-password items, accessible after first unlock on this device only.
security-framework = { version = "3.7", features = ["OSX_10_15"] }
core-foundation = "0.10"
# the sockets' event loop (one thread per socket sleeping in poll: no read timeouts)
mio = { version = "1", features = ["os-poll", "os-ext"] }
tungstenite = { version = "0.28", features = ["native-tls"] }
# Experimental voice sessions (src/voice/): WebRTC without IO of its own (str0m, Apple's crypto), the microphone and
# speaker through AVAudioEngine with voice processing (echo cancellation), and the mic permission. Opus is libopus,
# linked statically (build.rs).
str0m = { version = "0.24", default-features = false, features = ["apple-crypto"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString"] }
objc2-avf-audio = { version = "0.3", features = ["AVAudioEngine", "AVAudioNode", "AVAudioIONode", "AVAudioMixerNode", "AVAudioSourceNode", "AVAudioFormat", "AVAudioBuffer", "AVAudioTime", "AVAudioTypes", "AVAudioChannelLayout", "block2", "objc2-core-audio-types"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-core-audio-types = "0.3"
