[package]
name = "grimoire"
edition.workspace = true
version.workspace = true

[dependencies]
editor-core = { path = "../editor-core" }
# The grimoire-patches branch of Rune (IME, drag modifiers/clicks, viewport, italic, PageUp/Down,
# Tx::scroll_to/scroll_into_view, Tx::set_title); see docs/rune-capabilities.md.
rune = { path = "../../../worktrees/rune-grimoire/crates/rune" }
# Same version and features as Rune, so our layouts match the ones Rune paints.
parley = { version = "0.12", default-features = false, features = ["std"] }
arboard = { version = "3.6", default-features = false }
