<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grimoire</title>
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✎</text></svg>" />
    <link rel="preload" href="/api/config" as="fetch" crossorigin />
    <link rel="preload" href="/api/server" as="fetch" crossorigin />
    <link rel="preload" href="/api/me" as="fetch" crossorigin />
    <!--boot-preload-->
    <style>
      html, body { margin: 0; height: 100%; background: #fcfcfb; }
      #splash { position: fixed; inset: 0; z-index: 2147483646; display: grid; place-items: center; background: #fcfcfb; }
      #splash span { font: 600 11px/1 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, Arial, sans-serif; letter-spacing: 0.32em; padding-left: 0.32em; color: #a3a3aa; opacity: 0; animation: splash-in 0.4s ease-out 0.15s forwards; }
      @keyframes splash-in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #splash span { animation-duration: 0s; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><span>GRIMOIRE</span></div>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/editor.css" />
    <div id="app" aria-busy="true"></div>
    <script type="module" src="/dist/main.js"></script>
  </body>
</html>
